<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Convertek 3D mark">
  <defs>
    <!-- Tile body: liquid emerald glass -->
    <linearGradient id="tileFace" x1="96" y1="72" x2="416" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.28" stop-color="#34d399"/>
      <stop offset="0.58" stop-color="#10b981"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="tileSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="tileBottom" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gloss" x1="140" y1="90" x2="380" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrowMetal" x1="150" y1="180" x2="360" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ecfdf5"/>
      <stop offset="0.75" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="arrowShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#064e3b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#064e3b" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#022c22" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
    <filter id="arrowGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#022c22" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="0.4"/>
    </filter>
    <filter id="innerBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComposite in="o" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="inner"/>
      <feColorMatrix in="inner" type="matrix" values="0 0 0 0 0.02  0 0 0 0 0.17  0 0 0 0 0.13  0 0 0 0.45 0" result="shade"/>
      <feBlend in="SourceGraphic" in2="shade" mode="multiply"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="96" y="88" width="320" height="320" rx="78"/>
    </clipPath>
  </defs>

  <!-- Floor light -->
  <ellipse cx="256" cy="448" rx="170" ry="36" fill="url(#floorGlow)"/>

  <!-- 3D block: right side extrude -->
  <g filter="url(#softShadow)">
    <path d="M392 120 L448 152 L448 408 L392 376 Z" fill="url(#tileSide)"/>
    <!-- bottom extrude -->
    <path d="M120 408 L176 448 L448 408 L392 376 Z" fill="url(#tileBottom)"/>
    <!-- front face -->
    <rect x="96" y="88" width="320" height="320" rx="78" fill="url(#tileFace)" filter="url(#innerBevel)"/>
  </g>

  <!-- Edge rim highlight -->
  <rect x="96" y="88" width="320" height="320" rx="78" stroke="#ecfdf5" stroke-opacity="0.35" stroke-width="3" fill="none"/>
  <rect x="104" y="96" width="304" height="304" rx="72" stroke="#064e3b" stroke-opacity="0.18" stroke-width="2" fill="none"/>

  <!-- Specular glass sheet -->
  <g clip-path="url(#tileClip)">
    <rect x="96" y="88" width="320" height="320" fill="url(#gloss)"/>
    <path d="M96 110 Q180 200 250 180 T416 260 L416 88 L96 88 Z" fill="#fff" fill-opacity="0.12"/>
  </g>

  <!-- Soft orbit ring (depth) -->
  <ellipse cx="256" cy="248" rx="108" ry="102" stroke="#ecfdf5" stroke-opacity="0.18" stroke-width="3" fill="none"/>
  <ellipse cx="258" cy="252" rx="108" ry="102" stroke="#064e3b" stroke-opacity="0.15" stroke-width="2" fill="none"/>

  <!-- Dual convert arrows  glass tubes -->
  <g filter="url(#arrowGlow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- shadow pass -->
    <g stroke="#064e3b" stroke-opacity="0.25" stroke-width="22" transform="translate(0 4)">
      <path d="M168 220 H320"/>
      <path d="M284 178 L328 220 L284 262"/>
      <path d="M344 278 H192"/>
      <path d="M228 320 L184 278 L228 236"/>
    </g>
    <!-- body -->
    <g stroke="url(#arrowMetal)" stroke-width="18">
      <path d="M168 220 H320"/>
      <path d="M284 178 L328 220 L284 262"/>
      <path d="M344 278 H192"/>
      <path d="M228 320 L184 278 L228 236"/>
    </g>
    <!-- top highlight line -->
    <g stroke="#ffffff" stroke-opacity="0.65" stroke-width="5">
      <path d="M172 214 H316"/>
      <path d="M288 186 L324 218"/>
      <path d="M340 272 H196"/>
      <path d="M224 312 L188 278"/>
    </g>
  </g>

  <!-- Endpoint beads -->
  <g filter="url(#arrowGlow)">
    <circle cx="164" cy="220" r="14" fill="#ecfdf5"/>
    <circle cx="164" cy="216" r="6" fill="#fff" fill-opacity="0.7"/>
    <circle cx="348" cy="278" r="14" fill="#ecfdf5"/>
    <circle cx="348" cy="274" r="6" fill="#fff" fill-opacity="0.7"/>
  </g>
</svg>
