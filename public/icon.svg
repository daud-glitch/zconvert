<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="50%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6ee7b7"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.5"/>
  
  <!-- Convert Arrow Top -->
  <g filter="url(#glow)" transform="translate(50,50)">
    <path d="M-18 0 L0 -14 L18 0" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="rotate(-45)"/>
    <path d="M-18 0 L0 -5 L18 0" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3" transform="rotate(-45)"/>
  </g>
  
  <!-- Convert Arrow Bottom -->
  <g filter="url(#glow)" transform="translate(50,50)">
    <path d="M-18 0 L0 14 L18 0" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="rotate(45)"/>
    <path d="M-18 0 L0 5 L18 0" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3" transform="rotate(45)"/>
  </g>
  
  <!-- Sparkle Accents -->
  <circle cx="25" cy="25" r="2" fill="white" opacity="0.8"/>
  <circle cx="75" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="70" cy="70" r="2" fill="white" opacity="0.7"/>
  <circle cx="28" cy="72" r="1.5" fill="white" opacity="0.5"/>
</svg>
