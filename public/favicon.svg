<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Convertek">
  <defs>
    <linearGradient id="ctk-bg" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="0.45" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ctk-shine" x1="12" y1="4" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ctk-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- App tile -->
  <rect width="64" height="64" rx="16" fill="url(#ctk-bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#ctk-shine)"/>
  <!-- Soft ring: tech / continuous convert -->
  <circle cx="32" cy="32" r="18.5" stroke="#ecfdf5" stroke-opacity="0.22" stroke-width="1.5" fill="none"/>
  <!-- Dual convert arrows (identity) -->
  <g filter="url(#ctk-soft)" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- top: left → right -->
    <path d="M18 27h22"/>
    <path d="M33 20.5 40 27l-7 6.5"/>
    <!-- bottom: right → left -->
    <path d="M46 37H24"/>
    <path d="M31 43.5 24 37l7-6.5"/>
  </g>
  <!-- Node endpoints (file / data) -->
  <circle cx="17.5" cy="27" r="2.4" fill="#ecfdf5"/>
  <circle cx="46.5" cy="37" r="2.4" fill="#ecfdf5"/>
</svg>
