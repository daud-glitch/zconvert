<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="Convertek">
  <defs>
    <linearGradient id="hTile" x1="24" y1="28" x2="156" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.35" stop-color="#34d399"/>
      <stop offset="0.7" stop-color="#10b981"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="hSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="hBottom" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="hGloss" x1="40" y1="36" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hArrow" x1="50" y1="70" x2="140" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="word3d" x1="200" y1="60" x2="680" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="0.55" stop-color="#065f46"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <filter id="hShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#022c22" flood-opacity="0.28"/>
    </filter>
    <filter id="wordDepth" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#a7f3d0" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#064e3b" flood-opacity="0.18"/>
    </filter>
    <clipPath id="hClip">
      <rect x="28" y="36" width="128" height="128" rx="32"/>
    </clipPath>
  </defs>

  <!-- Mark -->
  <g filter="url(#hShadow)">
    <path d="M148 50 L168 62 L168 160 L148 148 Z" fill="url(#hSide)"/>
    <path d="M40 148 L60 168 L168 160 L148 148 Z" fill="url(#hBottom)"/>
    <rect x="28" y="36" width="128" height="128" rx="32" fill="url(#hTile)"/>
  </g>
  <rect x="28" y="36" width="128" height="128" rx="32" stroke="#ecfdf5" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>
  <g clip-path="url(#hClip)">
    <rect x="28" y="36" width="128" height="128" fill="url(#hGloss)"/>
  </g>
  <circle cx="92" cy="100" r="38" stroke="#ecfdf5" stroke-opacity="0.2" stroke-width="1.5" fill="none"/>

  <g stroke="url(#hArrow)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M58 88 H118"/>
    <path d="M102 70 L122 88 L102 106"/>
    <path d="M126 112 H66"/>
    <path d="M82 130 L62 112 L82 94"/>
  </g>
  <circle cx="56" cy="88" r="5" fill="#ecfdf5"/>
  <circle cx="128" cy="112" r="5" fill="#ecfdf5"/>

  <!-- Wordmark with soft 3D depth -->
  <g filter="url(#wordDepth)">
    <text
      x="196"
      y="122"
      font-family="Segoe UI, system-ui, ui-sans-serif, Helvetica, Arial, sans-serif"
      font-size="64"
      font-weight="700"
      letter-spacing="-1.5"
      fill="url(#word3d)"
    >Convertek</text>
  </g>
  <text
    x="198"
    y="152"
    font-family="Segoe UI, system-ui, ui-sans-serif, Helvetica, Arial, sans-serif"
    font-size="14"
    font-weight="600"
    letter-spacing="3.2"
    fill="#059669"
    fill-opacity="0.85"
  >convertek.tech</text>
</svg>
