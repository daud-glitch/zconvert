<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="50%" style="stop-color:#ecfdf5"/>
      <stop offset="100%" style="stop-color:#d1fae5"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="50%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6ee7b7"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    
    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#059669" flood-opacity="0.15"/>
    </filter>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#10b981" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Main Background -->
  <rect width="1200" height="630" fill="url(#bgGrad1)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Decorative Blobs -->
  <ellipse cx="200" cy="150" rx="300" ry="200" fill="#10b981" opacity="0.05"/>
  <ellipse cx="1000" cy="500" rx="350" ry="250" fill="#34d399" opacity="0.08"/>
  <circle cx="900" cy="150" r="180" fill="#6ee7b7" opacity="0.06"/>
  
  <!-- Main Content Card -->
  <rect x="80" y="80" width="1040" height="470" rx="32" fill="white" filter="url(#cardShadow)"/>
  
  <!-- Left Section: Logo & Branding -->
  <g transform="translate(150, 200)">
    <!-- Logo Circle -->
    <circle cx="100" cy="100" r="85" fill="url(#brandGrad)" filter="url(#glow3)"/>
    <circle cx="100" cy="100" r="75" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.5"/>
    
    <!-- Convert Icon -->
    <g transform="translate(100,100)">
      <!-- Top Arrow -->
      <g transform="rotate(-45)">
        <path d="M-35 0 L0 -28 L35 0" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M-35 0 L0 28 L35 0" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
    
    <!-- Sparkles -->
    <g fill="white" opacity="0.8">
      <circle cx="30" cy="30" r="4"/>
      <circle cx="175" cy="50" r="3"/>
      <circle cx="165" cy="170" r="4"/>
      <circle cx="40" cy="175" r="3"/>
    </g>
  </g>
  
  <!-- Center Section: Text -->
  <g transform="translate(450, 180)">
    <!-- Title -->
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="800" fill="#0f172a">
      Cloud Converter
    </text>
    
    <!-- Tagline -->
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#64748b">
      Universal File Converter
    </text>
    
    <!-- Description -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">
      Convert images, documents, data files &amp; more
    </text>
  </g>
  
  <!-- Right Section: Features -->
  <g transform="translate(450, 340)">
    <!-- Feature Pills Row -->
    <g transform="translate(0, 0)">
      <!-- 100+ Formats -->
      <rect x="0" y="0" width="160" height="48" rx="24" fill="#dcfce7"/>
      <text x="80" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#16a34a" text-anchor="middle">100+ Formats</text>
      
      <!-- Free -->
      <rect x="180" y="0" width="100" height="48" rx="24" fill="#fef3c7"/>
      <text x="230" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ca8a04" text-anchor="middle">100% Free</text>
      
      <!-- Private -->
      <rect x="300" y="0" width="120" height="48" rx="24" fill="#dbeafe"/>
      <text x="360" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2563eb" text-anchor="middle">Private</text>
    </g>
    
    <!-- Second Row -->
    <g transform="translate(0, 65)">
      <!-- No Limits -->
      <rect x="0" y="0" width="140" height="48" rx="24" fill="#f3e8ff"/>
      <text x="70" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#9333ea" text-anchor="middle">No Limits</text>
      
      <!-- Fast -->
      <rect x="160" y="0" width="100" height="48" rx="24" fill="#fce7f3"/>
      <text x="210" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#db2777" text-anchor="middle">Lightning</text>
      
      <!-- Easy -->
      <rect x="280" y="0" width="100" height="48" rx="24" fill="#e0f2fe"/>
      <text x="330" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#0284c7" text-anchor="middle">Easy Use</text>
    </g>
  </g>
  
  <!-- Format Icons Row -->
  <g transform="translate(450, 490)">
    <!-- PNG -->
    <g transform="translate(0, 0)">
      <rect width="70" height="70" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="35" y="28" font-family="system-ui, monospace" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">PNG</text>
      <text x="35" y="48" font-family="system-ui" font-size="10" fill="#16a34a" text-anchor="middle">Image</text>
    </g>
    
    <!-- JPG -->
    <g transform="translate(90, 0)">
      <rect width="70" height="70" rx="16" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>
      <text x="35" y="28" font-family="system-ui, monospace" font-size="14" font-weight="700" fill="#ca8a04" text-anchor="middle">JPG</text>
      <text x="35" y="48" font-family="system-ui" font-size="10" fill="#ca8a04" text-anchor="middle">Image</text>
    </g>
    
    <!-- PDF -->
    <g transform="translate(180, 0)">
      <rect width="70" height="70" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
      <text x="35" y="28" font-family="system-ui, monospace" font-size="14" font-weight="700" fill="#db2777" text-anchor="middle">PDF</text>
      <text x="35" y="48" font-family="system-ui" font-size="10" fill="#db2777" text-anchor="middle">Document</text>
    </g>
    
    <!-- WebP -->
    <g transform="translate(270, 0)">
      <rect width="70" height="70" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="35" y="28" font-family="system-ui, monospace" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">WebP</text>
      <text x="35" y="48" font-family="system-ui" font-size="10" fill="#2563eb" text-anchor="middle">Modern</text>
    </g>
    
    <!-- JSON -->
    <g transform="translate(360, 0)">
      <rect width="70" height="70" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
      <text x="35" y="28" font-family="system-ui, monospace" font-size="14" font-weight="700" fill="#9333ea" text-anchor="middle">JSON</text>
      <text x="35" y="48" font-family="system-ui" font-size="10" fill="#9333ea" text-anchor="middle">Data</text>
    </g>
    
    <!-- More -->
    <g transform="translate(450, 0)">
      <rect width="70" height="70" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="35" y="38" font-family="system-ui" font-size="14" font-weight="600" fill="#0284c7" text-anchor="middle">+95</text>
      <text x="35" y="52" font-family="system-ui" font-size="10" fill="#0284c7" text-anchor="middle">more</text>
    </g>
    
    <!-- Arrow -->
    <g transform="translate(540, 0)">
      <circle width="70" height="70" r="35" fill="url(#brandGrad)"/>
      <path d="M25 35 L45 35 M38 28 L45 35 L38 42" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
  
  <!-- Website URL -->
  <text x="1100" y="580" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8" text-anchor="end">www.cloudconveter.tech</text>
</svg>
