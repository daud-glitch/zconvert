<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="50%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6ee7b7"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" filter="url(#dropShadow)"/>
  
  <!-- Decorative Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4"/>
  
  <!-- Inner Circle -->
  <circle cx="50" cy="50" r="34" fill="#ffffff" opacity="0.15"/>
  
  <!-- Convert Arrows Group -->
  <g filter="url(#glow2)">
    <!-- Top Arrow (PNG to JPG direction) -->
    <g transform="translate(50,50) rotate(-45)">
      <path d="M-20 0 L0 -16 L20 0" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M0 -16 L0 16" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3"/>
    </g>
    
    <!-- Bottom Arrow (Return direction) -->
    <g transform="translate(50,50) rotate(45)">
      <path d="M-20 0 L0 16 L20 0" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
  
  <!-- Sparkle Stars -->
  <g fill="white" opacity="0.9">
    <polygon points="20,15 22,20 27,20 23,24 25,30 20,26 15,30 17,24 13,20 18,20"/>
    <circle cx="80" cy="22" r="2"/>
    <circle cx="75" cy="78" r="1.5"/>
    <circle cx="22" cy="80" r="2"/>
  </g>
  
  <!-- Format Letters -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8" fill="white">
    <text x="15" y="65">PNG</text>
    <text x="62" y="85">JPG</text>
    <text x="62" y="45">PDF</text>
  </g>
</svg>
